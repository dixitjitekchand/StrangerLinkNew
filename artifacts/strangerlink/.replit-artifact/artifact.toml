kind = "web"
previewPath = "/"
title = "StrangerLink"
version = "1.0.0"
id = "artifacts/strangerlink"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18219

[services.development]
run = "pnpm --filter @workspace/strangerlink run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/strangerlink", "run", "build" ]
publicDir = "artifacts/strangerlink/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18219"
BASE_PATH = "/"
